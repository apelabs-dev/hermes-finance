# The docs site (MkDocs 1.x + Material 9). Build it with:  mkdocs build --strict   (see docs/contributing.md)
# Pin mkdocs<2: MkDocs 2.0 drops the plugin and theme systems this site (Material, the hook below) relies on.
site_name: hermes-finance
site_description: >-
  A self-hosted personal-finance dashboard on Plaid and a local SQLite database, with native tools for Hermes and an
  MCP server for other agents.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  font: false            # system fonts: the built site loads no web fonts
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light theme

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A broken link, a missing page or a bad anchor is a warning, and `strict` makes every warning fail the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Left out of the site: HOTFIX-1.md (an internal working note, not in the public release), rules-api.md (an API
# reference whose examples come from a test scene, regenerated by scripts/rules_api_doc.py) and demo.md (the static
# demo, not in the public release until its parity check passes).
exclude_docs: |
  HOTFIX-1.md
  rules-api.md
  demo.md

# Fails the build while docs/reference/*.md is stale (scripts/gen_docs_reference.py writes them from the code).
hooks:
  - scripts/mkdocs_hooks.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Plaid setup: plaid.md
  - AI modes: ai-modes.md
  - Security model: security.md
  - Settings: settings.md
  - User guide: guide.md
  - Guides:
      - Configuration and doctor: configuration.md
      - Backup and restore: backup-restore.md
      - Scheduled reports (Hermes): plugin-crons.md
      - Ask through Hermes: ask-hermes-bridge.md
  - Reference:
      - CLI: reference/cli.md
      - Agent tools: reference/tools.md
      - Settings keys: reference/settings-keys.md
  - Architecture: architecture.md
  - FAQ: faq.md
  - Contributing:
      - Contributing: contributing.md
      - The privacy scanner: dehardcode.md
      - UI invariants: ui-invariants.md
      - CSS load order: css-load-order.md
