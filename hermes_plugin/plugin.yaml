name: hermes-finance
version: 0.2.3 # x-release-please-version
description: "Answers money questions from your local hermes-finance database (spending, budgets, transactions, net worth, bills, loans, investments, cash flow, goals, categorization rules; read-only), syncs your banks on request, and files transactions, adds rules, sets budget caps and tracks bills only after you approve each change."
kind: standalone
manifest_version: 2
api_version: 1
provides_tools:
  - finance_spend
  - finance_budget_status
  - finance_transactions
  - finance_networth
  - finance_bills
  - finance_loans
  - finance_holdings
  - finance_cashflow
  - finance_status
  - finance_goals
  - finance_rules
  - finance_sync
  - finance_set_category
  - finance_add_rule
  - finance_set_cap
  - finance_track_bill
provides_hooks:
  - pre_tool_call
config_schema:
  HERMES_FINANCE_DATA_DIR:
    type: str
    default: ""
    description: "The hermes-finance data directory (the one holding finance.db). Empty: the app's own choice (FINANCE_DATA_DIR, else the app's data/ directory), so the plugin and the app always read the same database."
  HERMES_FINANCE_APP_DIR:
    type: str
    default: ""
    description: "Prerequisite for a standalone plugin install: a trusted hermes-finance checkout (its src/), prepared with uv sync using Python 3.12. Also read from the environment variable of the same name. Run uv run finance doctor there to configure optional integrations. The daily and weekly report jobs run from it too (hermes finance crons)."
  HERMES_FINANCE_CRON_DELIVER:
    type: str
    default: ""
    description: "Where a new daily or weekly report job is delivered when `hermes finance crons plan` gets no --deliver: one Hermes delivery target as PLATFORM:CHAT_ID (for example discord:<channel id>). Empty: plan asks for --deliver. Existing jobs keep their own destination."
  PLAID_CLIENT_ID:
    type: secret
    env: PLAID_CLIENT_ID
    label: "Plaid client ID"
    description: "Optional. Only finance_sync and the report jobs use it; installing and every read tool need no key. Set it with `hermes config set PLAID_CLIENT_ID <value>` or here."
  PLAID_SECRET:
    type: secret
    env: PLAID_SECRET
    label: "Plaid secret"
    description: "Optional. Only finance_sync and the report jobs use it; installing and every read tool need no key. Set it with `hermes config set PLAID_SECRET <value>` or here."
  PLAID_ENV:
    type: secret
    env: PLAID_ENV
    label: "Plaid environment"
    description: "Optional: production or sandbox; empty: production. Only finance_sync and the report jobs use it. Set it with `hermes config set PLAID_ENV <value>` or here."
  APCA_API_KEY_ID:
    type: secret
    env: APCA_API_KEY_ID
    label: "Alpaca key ID"
    description: "Optional: a live account's read-only key. Only the report jobs use it; installing and every read tool need no key. Set it with `hermes config set APCA_API_KEY_ID <value>` or here."
  APCA_API_SECRET_KEY:
    type: secret
    env: APCA_API_SECRET_KEY
    label: "Alpaca secret key"
    description: "Optional. Only the report jobs use it; installing and every read tool need no key. Set it with `hermes config set APCA_API_SECRET_KEY <value>` or here."
  APCA_ENV:
    type: secret
    env: APCA_ENV
    label: "Alpaca environment"
    description: "Optional: must be live; paper keys are refused. Only the report jobs use it. Set it with `hermes config set APCA_ENV live` or here."
tags: [finance, budgeting, personal]
